server.port=${SERVER_PORT:8080}

# Every value below falls back to a localhost default for local dev,
# and is overridden by an environment variable in Docker / cloud.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

blog.owner.name=${BLOG_OWNER_NAME:Murat}
blog.owner.title=${BLOG_OWNER_TITLE:Software Developer}
blog.owner.bio=${BLOG_OWNER_BIO:I write about programming and technology.}
blog.owner.photo=/images/profile.jpg

blog.admin.username=${BLOG_ADMIN_USERNAME:admin}
blog.admin.password=${BLOG_ADMIN_PASSWORD:admin123}

spring.redis.master.host=${REDIS_MASTER_HOST:127.0.0.1}
spring.redis.master.port=${REDIS_MASTER_PORT:6379}
spring.redis.slave.host=${REDIS_SLAVE_HOST:127.0.0.1}
spring.redis.slave.port=${REDIS_SLAVE_PORT:6380}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Health endpoint for container / load-balancer probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
