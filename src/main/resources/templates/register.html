<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #526cfe;
      --danger: #e05c5c;
      --bg: #13131f;
      --card: #1e1e2e;
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.87);
      --muted: rgba(255,255,255,0.45);
      --input-bg: rgba(255,255,255,0.05);
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
    }
    .logo {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 32px;
    }

    /* Alerts */
    .alert {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13.5px;
      margin-bottom: 20px;
    }
    .alert-error {
      background: rgba(224,92,92,0.12);
      border: 1px solid rgba(224,92,92,0.3);
      color: #f08080;
    }
    .alert-success {
      background: rgba(82,254,130,0.08);
      border: 1px solid rgba(82,254,130,0.2);
      color: #6dffb0;
    }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 14px;
      font-family: 'Roboto', sans-serif;
      font-size: 14.5px;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(82,108,254,0.15);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }

    .btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.18s;
    }
    .btn:hover { opacity: 0.85; }

    .footer-text {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 24px;
    }
    .footer-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">myblog</p>
    <h1>Create account</h1>
    <p class="subtitle">Join to comment and interact</p>

    <!-- Error -->
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <!-- Success -->
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/register}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="yourusername" required
               th:value="${username}"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required/>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword"
               placeholder="••••••••" required/>
      </div>

      <button type="submit" class="btn">Create account</button>
    </form>

    <p class="footer-text">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</body>
</html>
